name: Validate repository

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate packages and repository.json
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate manifests and index
        run: python tools/generate_repository.py --check

      - name: Build hello from source
        run: python tools/build_package.py packages/hello --output-dir dist

      - name: Validate hello dbpkg
        run: python tools/validate_package.py dist/hello-1.0.0-x86_64.dbpkg --expected-manifest packages/hello/package.json

      - name: Verify published installable assets
        run: python tools/verify_downloads.py
