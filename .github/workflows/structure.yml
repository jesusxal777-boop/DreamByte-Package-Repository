name: Initialize DreamByte Package Repository

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  initialize:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create repository structure
        run: |
          mkdir -p packages/python
          mkdir -p packages/wget

          cat > repository.json <<'EOF'
          {
            "name": "DreamByte Official Package Repository",
            "version": 1,
            "packages": []
          }
          EOF

          cat > README.md <<'EOF'
          # DreamByte Package Repository

          Official package repository for DreamByte Terminal and DreamByte OS.
          EOF

          cat > packages/python/package.json <<'EOF'
          {
            "name": "python",
            "version": "3.x",
            "description": "Python programming language",
            "maintainer": "DreamByte Studios",
            "status": "planned"
          }
          EOF

          cat > packages/python/README.md <<'EOF'
          # Python

          Python package for DreamByte Terminal.

          Status: Planned
          EOF

          cat > packages/wget/package.json <<'EOF'
          {
            "name": "wget",
            "version": "1.x",
            "description": "Network download utility",
            "maintainer": "DreamByte Studios",
            "status": "planned"
          }
          EOF

          cat > packages/wget/README.md <<'EOF'
          # wget

          Network download utility for DreamByte Terminal.

          Status: Planned
          EOF

      - name: Commit structure
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .
          git diff --cached --quiet || git commit -m "Initialize DreamByte package repository"
          git push
